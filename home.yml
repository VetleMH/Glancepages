#Definer side
- name: Startpage
  width: wide
  hide-desktop-navigation: true
  center-vertically: true

#Venstre kolonne

  columns:
    - size: small
      widgets:
#stats!

        - type: server-stats
          servers:
            - type: local
              name: Multe
#RSS feed
        - type: rss
          title: Innenriks
          style: horisontal-cards
          collapse-after: 5
          feeds:
            - url: https://www.nrk.no/innlandet/toppsaker.rss
              title: NRK
            - url: https://www.h-a.no/service/rss/
              title: HA
           # - url:
           #   title:

#Self host tjenester

    - size: full
      widgets:
        - type: search
          autofocus: true

        - type: monitor
          cache: 1m
          title: Services
          sites:
